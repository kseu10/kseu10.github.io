<!doctype html>
<html lang="ko">
<head>

  <style>
    :root { --bg: #fff8ef; --card: #ffffff; --text: #3b2414; --sub: #7a5c45; --brand: #e8600f; --line: #f1dfc8; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1d1712; --card: #2a211a; --text: #f6e9dc; --sub: #c9b29c; --line: #3d3027; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    .lead { color: var(--sub); margin: 0 0 28px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
    .card h2 { font-size: 19px; margin: 0 0 6px; }
    .card p { margin: 0 0 10px; color: var(--sub); }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--brand); border: 1px solid var(--brand); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
    a { color: var(--brand); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links a { margin-right: 14px; }
    footer { margin-top: 32px; font-size: 14px; color: var(--sub); }
  </style>
</head>

</html>
